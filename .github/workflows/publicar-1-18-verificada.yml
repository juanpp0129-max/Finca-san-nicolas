name: Publicar Finca San Nicolas 1.18 verificada
on:
  workflow_run:
    workflows: ["Verificar APK candidato 1.18"]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.head_sha == 'fc7f609289d6dd9d6d6bd4e0b12612e4943753e4' && github.event.workflow_run.head_branch == 'prueba-publicacion' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verificar y publicar solamente el APK aprobado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("version.json").read_text())
          if m["versionCode"] != 202611247 or m["versionName"] != "1.17":
              raise SystemExit("Canal oficial distinto de 1.17: no se publica")
          PY
          target="Finca_San_Nicolas_Android_1_18.apk"
          test ! -e "$target"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/juanpp0129-max/Finca-san-nicolas/fc7f609289d6dd9d6d6bd4e0b12612e4943753e4/Finca_San_Nicolas_Android_1_18_candidata.apk" -o "$target"
          echo "034ee28eeb09f0132edb403f894f8be3f1ec496583aa4fffccfd55b59094895c  $target" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          m = {
              "versionCode": 202611248,
              "versionName": "1.18",
              "sha256": "034ee28eeb09f0132edb403f894f8be3f1ec496583aa4fffccfd55b59094895c",
              "apkUrl": "https://raw.githubusercontent.com/juanpp0129-max/Finca-san-nicolas/main/Finca_San_Nicolas_Android_1_18.apk"
          }
          Path("version.json").write_text(json.dumps(m, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" version.json
          git commit -m "Publicar Android 1.18 tras prueba nativa exitosa"
          git push origin HEAD:main
