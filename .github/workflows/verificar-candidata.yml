name: Verificar APK candidato 1.18
on:
  push:
    branches: [prueba-publicacion]
    paths: ['Finca_San_Nicolas_Android_1_18_candidata.apk', '.github/workflows/verificar-candidata.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener APK y comprobar integridad
        env:
          BASE: https://raw.githubusercontent.com/juanpp0129-max/Finca-san-nicolas
          EXPECTED: 034ee28eeb09f0132edb403f894f8be3f1ec496583aa4fffccfd55b59094895c
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$BASE/$GITHUB_SHA/Finca_San_Nicolas_Android_1_18_candidata.apk" -o candidate.apk
          curl -fsSL --retry 3 "$BASE/main/Finca_San_Nicolas_Android_1_16.apk" -o original.apk
          echo "$EXPECTED  candidate.apk" | sha256sum -c -
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          signer="$(find "$sdk/build-tools" -name apksigner | sort -V | tail -1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs candidate.apk | tee candidate-signature.txt
          "$signer" verify --verbose --print-certs original.apk | tee original-signature.txt
          diff <(grep 'certificate SHA-256 digest:' candidate-signature.txt) <(grep 'certificate SHA-256 digest:' original-signature.txt)
          aapt="$(dirname "$signer")/aapt"
          "$aapt" dump badging candidate.apk | tee candidate-manifest.txt
          grep -F "package: name='com.fincasannicolas.avicola' versionCode='202611248' versionName='1.18'" candidate-manifest.txt
          unzip -t candidate.apk
          curl -fsSL --retry 3 "$BASE/main/Finca_San_Nicolas_Android_1_17.apk" -o previous.apk
          echo "1fa292aebe3605d00202561fa70a0da6158cd8561b6ca39b97484974f9aaa97c  previous.apk" | sha256sum -c -
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile("previous.apk") as a, ZipFile("candidate.apk") as b:
              assert sorted(a.namelist()) == sorted(b.namelist())
              changed = {n for n in a.namelist() if a.read(n) != b.read(n)}
              assert changed == {"AndroidManifest.xml","assets/index.html","assets/sw.js"}, changed
              assert a.read("classes.dex") == b.read("classes.dex")
              html = b.read("assets/index.html").decode()
              for token in ("lotCostDetail","lotDetailPanel","Costo acumulado registrado","Historial del lote","costSummary"):
                  assert token in html, token
              assert "avicola_san_nicolas_v1" in html
              print("Base nativa 1.17 intacta y ficha de lote integrada")
          PY
      - name: Conservar resultados
        uses: actions/upload-artifact@v4
        with:
          name: verificacion-candidata
          path: |
            candidate-signature.txt
            original-signature.txt
            candidate-manifest.txt
          retention-days: 7
  android-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preparar Android de prueba
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="$sdk/emulator:$sdk/platform-tools:$sdk/cmdline-tools/latest/bin:$PATH"
          test -e /dev/kvm
          if [ ! -w /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/finca-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-35;google_apis;x86_64"
          timeout 600 sdkmanager --install "platform-tools" "emulator" "$image"
          printf "no\n" | timeout 120 avdmanager create avd --force --name finca-test --package "$image" --device pixel_6 --path "$ANDROID_AVD_HOME/finca-test.avd"
          test -s "$ANDROID_AVD_HOME/finca-test.avd/config.ini"
          printf "avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n" "$ANDROID_AVD_HOME/finca-test.avd" > "$ANDROID_AVD_HOME/finca-test.ini"
          emulator -list-avds | grep -Fx finca-test
          emulator -accel-check
          adb start-server
          emulator -avd finca-test -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          emu_pid=$!
          ready=0
          for i in $(seq 1 120); do
            if ! kill -0 "$emu_pid" 2>/dev/null; then cat emulator.log; exit 1; fi
            if [ "$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)" = 1 ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != 1 ]; then cat emulator.log; adb devices -l; exit 1; fi
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          export ANDROID_SERIAL=emulator-5554
          ADB="$sdk/platform-tools/adb"
          test -x "$ADB"
          "$ADB" version
          "$ADB" get-state | grep -Fx device
          BASE="https://raw.githubusercontent.com/juanpp0129-max/Finca-san-nicolas"
          curl -fsSL --retry 3 "$BASE/main/Finca_San_Nicolas_Android_1_16.apk" -o original.apk
          curl -fsSL --retry 3 "$BASE/$GITHUB_SHA/Finca_San_Nicolas_Android_1_18_candidata.apk" -o candidate.apk
          echo "034ee28eeb09f0132edb403f894f8be3f1ec496583aa4fffccfd55b59094895c  candidate.apk" | sha256sum -c -
          curl -fsSL --retry 3 "$BASE/main/Finca_San_Nicolas_Android_1_17.apk" -o previous.apk
          echo "1fa292aebe3605d00202561fa70a0da6158cd8561b6ca39b97484974f9aaa97c  previous.apk" | sha256sum -c -
          package=com.fincasannicolas.avicola
          activity="$package/.MainActivity"
          for oldcode in 202611246 202611247; do
            case "$oldcode" in
              202611246) source="$PWD/original.apk" ;;
              202611247) source="$PWD/previous.apk" ;;
            esac
            mkdir -p "upgrade-$oldcode"
            cp candidate.apk "upgrade-$oldcode/candidate.apk"
            pushd "upgrade-$oldcode" >/dev/null
          "$ADB" logcat -c
          timeout 90 "$ADB" install "$source" | tee install-original.log
          grep -Fx Success install-original.log
          timeout 60 "$ADB" shell am start -W -n "$activity" | tee start-original.log
          grep -F "Status: ok" start-original.log
          "$ADB" shell dumpsys package "$package" > original-package.log
          grep -F "versionCode=$oldcode" original-package.log
          sleep 5
          "$ADB" shell pidof "$package"
          "$ADB" shell am force-stop "$package"
          timeout 90 "$ADB" install -r candidate.apk | tee install-candidate.log
          grep -Fx Success install-candidate.log
          timeout 60 "$ADB" shell am start -W -n "$activity" | tee start-candidate.log
          grep -F "Status: ok" start-candidate.log
          "$ADB" shell dumpsys package "$package" > candidate-package.log
          grep -F "versionCode=202611248" candidate-package.log
          python - <<'PY'
          from pathlib import Path
          import re
          a = Path("original-package.log").read_text()
          b = Path("candidate-package.log").read_text()
          for key in ("firstInstallTime", "dataDir"):
              pattern = rf"^\s*{key}=([^\r\n]+)"
              before = re.search(pattern, a, re.M)
              after = re.search(pattern, b, re.M)
              assert before and after and before.group(1)==after.group(1), f"Changed installation identity: {key}"
          print("Identidad de la instalación y directorio de datos conservados")
          PY
          sleep 8
          "$ADB" shell pidof "$package"
          "$ADB" shell input keyevent 4
          for i in $(seq 1 5); do
            sleep 2
            if timeout 25 "$ADB" shell uiautomator dump /sdcard/finca.xml && "$ADB" pull /sdcard/finca.xml back-screen.xml && grep -Fq "Cerrar Finca San Nicolás" back-screen.xml; then break; fi
          done
          grep -F "Cerrar Finca San Nicolás" back-screen.xml
          "$ADB" shell input keyevent 4
          sleep 2
          "$ADB" shell pidof "$package"
          "$ADB" exec-out screencap -p > android-screen.png
          test -s android-screen.png
          "$ADB" logcat -d -s AndroidRuntime:E > runtime.log
          if grep -F "FATAL EXCEPTION" runtime.log; then exit 1; fi
            popd >/dev/null
            if [ "$oldcode" = "202611246" ]; then "$ADB" uninstall "$package"; fi
          done
      - name: Evidencia Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-android-candidata
          path: |
            emulator.log
            upgrade-*/
          if-no-files-found: warn
          retention-days: 7
